name: UI refactor checks

on:
  push:
    branches: ["feat/ui-base-refactor"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            ref: e554a382dabdb79994fa11a4482c072c9f968c82
          - name: candidate
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: amyu/setup-android@v5
      - uses: gradle/actions/setup-gradle@v6
      - name: Use disposable debug signing for both comparison builds
        run: |
          cat > "$RUNNER_TEMP/ui-debug-signing.gradle" <<'INIT'
          gradle.afterProject { p ->
              if (p.path == ':app') {
                  def android = p.extensions.findByName('android')
                  android.buildTypes.getByName('debug').signingConfig = android.signingConfigs.getByName('debug')
              }
          }
          INIT
      - name: Compile application and run existing unit tests
        run: bash ./gradlew --no-daemon -I "$RUNNER_TEMP/ui-debug-signing.gradle" :app:assembleDebug :app:testDebugUnitTest
      - name: Check mixui module
        if: matrix.name == 'candidate'
        run: bash ./gradlew --no-daemon :mixui:assembleDebug :mixui:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-${{ matrix.name }}-build-evidence
          path: |
            app/build/outputs/**/*.apk
            app/build/test-results/**
            mixui/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
